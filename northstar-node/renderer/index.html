<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>SoundChain · North Star</title>
    <style>
      :root {
        --bg: #06070f;
        --surface: #0c0e1c;
        --border: #1c2036;
        --text: #e8ecff;
        --muted: #7c84a8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 16px 18px 12px;
        border-bottom: 1px solid var(--border);
        position: relative;
      }
      .help {
        position: absolute; top: 14px; right: 16px;
        text-decoration: none; font-size: 12px; font-weight: 600; color: #bcd0ff;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 999px; padding: 4px 11px;
      }
      .help:hover { border-color: #38406e; }
      .brand {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
        background: linear-gradient(90deg, #ff5e9a, #ffce5e, #5effa3, #5ec8ff, #b98bff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .peers {
        display: inline-flex; align-items: center; gap: 6px;
        margin-top: 10px; padding: 4px 10px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--border);
        font-size: 12px; color: var(--muted);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #5effa3; box-shadow: 0 0 8px #5effa3; }
      .dot.solo { background: #5c6488; box-shadow: none; }
      #feed { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
      .post {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; padding: 10px 12px;
      }
      .post.mine { border-color: #2a3566; background: #0e1330; }
      .post .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
      .post .name { color: #9fb0ff; font-weight: 600; }
      .post .text { white-space: pre-wrap; word-break: break-word; }
      .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 13px; }
      footer { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
      #text {
        flex: 1; resize: none; height: 40px; padding: 9px 12px;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 10px; font: inherit;
      }
      #text:focus { outline: none; border-color: #38406e; }
      #send {
        border: none; border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer;
        color: #06070f; background: linear-gradient(90deg, #5ec8ff, #5effa3);
      }
      #send:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <header>
      <a class="help" href="manual.html">❔ Help</a>
      <div class="brand">🌟 SoundChain · North Star</div>
      <div class="sub" id="ident">sovereign node — no server, no cloud</div>
      <div class="peers"><span class="dot solo" id="dot"></span><span id="peerLabel">starting…</span></div>
    </header>
    <div id="feed"><div class="empty">No posts yet. Write one — it'll appear on every laptop on this Wi-Fi, with no server in the middle.</div></div>
    <footer>
      <textarea id="text" placeholder="Post to the mesh…" maxlength="1000"></textarea>
      <button id="send">Post</button>
    </footer>
    <script src="renderer.js"></script>
  </body>
</html>
