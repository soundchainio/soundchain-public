<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <title>Lucy</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05070d;
        color: #e5e7eb;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
      }
      .orb {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #22d3ee, #0e7490 60%, #05070d 100%);
        box-shadow: 0 0 40px rgba(34, 211, 238, 0.45);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; margin: 0; }
      p { font-size: 13px; color: #6b7280; margin: 0; max-width: 260px; line-height: 1.5; }
      .dot { color: #22d3ee; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="orb"></div>
      <h1>LUCY</h1>
      <p>Waking up<span class="dot">…</span><br />Connecting to the brain on anvil.</p>
    </div>
  </body>
</html>
