query ExploreTracksSlim($sort: SortExploreTracks, $search: String, $genre: String, $page: PageInput) {
  exploreTracks(sort: $sort, search: $search, genre: $genre, page: $page) {
    nodes {
      id
      title
      artist
      artworkUrl
      playbackUrl
      assetUrl
      createdAt
      isFavorite
      trackEditionId
      editionSize
      genres
      nftData {
        tokenId
        contract
      }
    }
    pageInfo {
      hasNextPage
      endCursor
      totalCount
    }
  }
}
