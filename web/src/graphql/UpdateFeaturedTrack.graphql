mutation UpdateFeaturedTrack($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    profile {
      id
      featuredTrackId
      featuredAudioUrl
      featuredAudioTitle
      featuredAudioArtist
      featuredAudioCoverUrl
      wallAudioPlaylist {
        audioUrl
        title
        artist
        coverUrl
        wallPostId
      }
    }
  }
}
