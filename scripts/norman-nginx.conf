# nginx server block for norman.soundchain.io → anvil's Ollama via reverse-SSH tunnel.
# Drop into /etc/nginx/sites-available/norman on EC2 (44.209.136.62), symlink to
# sites-enabled, reload nginx, then run `sudo certbot --nginx -d norman.soundchain.io`
# which appends the SSL server block + cert paths automatically. After certbot,
# all HTTP traffic redirects to HTTPS.
#
# Critical: proxy_buffering off + proxy_request_buffering off so Ollama's
# line-delimited JSON streams reach the browser token-by-token instead of being
# buffered into one big response. Same posture as Vercel's SSE proxies.

server {
    listen 80;
    listen [::]:80;
    server_name norman.soundchain.io;

    # Health probe — confirms nginx is reaching anvil through the reverse tunnel.
    location = /health {
        proxy_pass http://127.0.0.1:11434/api/tags;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:11434;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:11434;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming-friendly settings
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # Generous body size for chat history payloads
        client_max_body_size 10m;
    }
}
